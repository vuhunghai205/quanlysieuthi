<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Sản phẩm - Hùng Hải Mart</title>
    <link rel="stylesheet" href="css/bien.css">
    <link rel="stylesheet" href="css/bo-cuc.css">
    <link rel="stylesheet" href="css/thanh-phan.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-logo">Hùng Hải Mart</div>
            <nav class="sidebar-nav">
                <a href="tong-quan.html" class="nav-item">Tổng quan</a>
                <a href="san-pham.html" class="nav-item active">Sản phẩm</a>
                <a href="don-hang.html" class="nav-item">Đơn hàng</a>
                <a href="ton-kho.html" class="nav-item">Tồn kho</a>
                <a href="nha-cung-cap.html" class="nav-item" id="menu-ncc" style="display:none">Nhà cung cấp</a>
                <a href="khach-hang.html" class="nav-item">Khách hàng</a>
                <a href="bao-cao.html" class="nav-item">Báo cáo</a>
                <a href="chi-nhanh.html" class="nav-item" id="menu-chi-nhanh" style="display:none">Chi nhánh</a>
                <a href="nguoi-dung.html" class="nav-item" id="menu-nguoi-dung" style="display:none">Người dùng</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div style="font-weight: 500;">Quản lý Sản phẩm</div>
                <div><button onclick="showChangePasswordModal()" class="btn" style="border: 1px solid var(--border); margin-right: 10px;">Đổi mật khẩu</button><button onclick="logout()" class="btn">Đăng xuất</button></div>
            </header>
            
            <div class="content-body">
                <div class="card">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 0.75rem;">
                        <div style="display: flex; align-items: center; gap: 0.75rem;">
                            <h3 class="card-title" style="margin: 0;">Danh sách sản phẩm</h3>
                            <span id="branchBadge" style="font-size: 0.8rem; font-weight: 500; color: var(--primary); background: var(--primary-light); padding: 0.25rem 0.65rem; border-radius: var(--radius-full); border: 1px solid var(--mint);"></span>
                        </div>
                        <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                            <select id="branchFilter" class="form-control" style="width: 230px; display:none;" onchange="loadData()">
                                <option value="">Tất cả chi nhánh (Toàn hệ thống)</option>
                                <option value="1">Hùng Hải Mart Hà Nội</option>
                                <option value="2">Hùng Hải Mart Hồ Chí Minh</option>
                            </select>
                            <input type="text" id="searchInput" class="form-control" placeholder="Tìm kiếm sản phẩm..." style="width: 200px;" onkeyup="filterTable()">
                            <button class="btn btn-primary" id="btnAddProduct" style="display:none;" onclick="showModal()">+ Thêm sản phẩm</button>
                        </div>
                    </div>
                    
                    <div id="errorAlert" class="alert alert-danger" style="display:none;"></div>
                    
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Mã SP</th>
                                <th>Tên sản phẩm</th>
                                <th id="thBranch" style="display:none;">Chi nhánh</th>
                                <th>Nhà cung cấp</th>
                                <th>Giá bán</th>
                                <th>Tồn kho</th>
                                <th>Trạng thái</th>
                                <th>Thao tác</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <tr><td colspan="7">Đang tải...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal Form -->
    <div class="modal" id="productModal">
        <div class="modal-content">
            <h3 id="modalTitle" style="margin-bottom: 1rem; color: var(--primary);">Thêm sản phẩm</h3>
            <div id="modalError" class="alert alert-danger"></div>
            <form id="productForm">
                <input type="hidden" id="sp_id">
                
                <div class="form-group">
                    <label class="form-label">Mã SP</label>
                    <input type="text" id="sp_ma" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Tên sản phẩm</label>
                    <input type="text" id="sp_ten" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Nhà cung cấp</label>
                    <select id="sp_ncc" class="form-control" required></select>
                </div>
                <div class="form-group" id="group_chinhanh" style="display:none;">
                    <label class="form-label">Chi nhánh</label>
                    <select id="sp_chinhanh" class="form-control"></select>
                </div>
                <div class="form-group" style="display: flex; gap: 1rem;">
                    <div style="flex: 1;">
                        <label class="form-label">Giá bán</label>
                        <input type="number" id="sp_gia_ban" class="form-control" required>
                    </div>
                    <div style="flex: 1;">
                        <label class="form-label">Giá vốn</label>
                        <input type="number" id="sp_gia_von" class="form-control" required>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Đơn vị tính</label>
                    <input type="text" id="sp_don_vi" class="form-control" placeholder="Cái, Hộp, Chai...">
                </div>
                <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                    <button type="button" class="btn" style="flex: 1; border: 1px solid var(--border);" onclick="hideModal()">Hủy</button>
                    <button type="submit" class="btn btn-primary" style="flex: 1;">Lưu</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        checkAuth();
        const user = getUser();
        if (user) {
            if (user.role === 'ADMIN') {
                if (document.getElementById('menu-chi-nhanh')) document.getElementById('menu-chi-nhanh').style.display = 'block';
                if (document.getElementById('menu-nguoi-dung')) document.getElementById('menu-nguoi-dung').style.display = 'block';
                if (document.getElementById('branchFilter')) document.getElementById('branchFilter').style.display = 'block';
                if (document.getElementById('thBranch')) document.getElementById('thBranch').style.display = 'table-cell';
                if (document.getElementById('group_chinhanh')) document.getElementById('group_chinhanh').style.display = 'block';
                document.getElementById('branchBadge').textContent = 'Toàn hệ thống (Tổng cả 2 chi nhánh)';
            } else {
                const branchName = user.branchName || (user.branch == 1 ? 'Chi nhánh Hà Nội' : (user.branch == 2 ? 'Chi nhánh Hồ Chí Minh' : 'Chi nhánh riêng'));
                document.getElementById('branchBadge').textContent = branchName;
            }
            if (user.role === 'ADMIN' || user.role === 'MANAGER') {
                if (document.getElementById('menu-ncc')) document.getElementById('menu-ncc').style.display = 'block';
                document.getElementById('btnAddProduct').style.display = 'block';
            }
        }

        async function loadData() {
            try {
                let url = '/san-pham';
                const branchFilter = document.getElementById('branchFilter');
                if (user && user.role === 'ADMIN' && branchFilter && branchFilter.value) {
                    url += `?chiNhanhId=${branchFilter.value}`;
                }
                const res = await goiApi(url);
                const tbody = document.getElementById('tableBody');
                tbody.innerHTML = '';
                
                if (!res.data || res.data.length === 0) {
                    const colSpan = (user && user.role === 'ADMIN') ? 8 : 7;
                    tbody.innerHTML = `<tr><td colspan="${colSpan}" style="text-align:center">Chưa có sản phẩm nào.</td></tr>`;
                    return;
                }

                res.data.forEach(sp => {
                    const status = sp.hoatDong ? '<span style="color:var(--primary)">Kinh doanh</span>' : '<span style="color:var(--danger)">Ngừng</span>';
                    const price = new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(sp.giaBan);
                    const ncc = sp.nhaCungCap ? sp.nhaCungCap.tenNhaCungCap : '-';
                    const branchName = sp.chiNhanh ? sp.chiNhanh.tenChiNhanh : (sp.chiNhanhId == 1 ? 'Hà Nội' : (sp.chiNhanhId == 2 ? 'Hồ Chí Minh' : '-'));
                    
                    let actions = '';
                    if (user.role === 'ADMIN' || user.role === 'MANAGER') {
                        actions = `<button class="btn" style="border: 1px solid var(--border); padding: 0.25rem 0.5rem; font-size: 0.75rem;" onclick='editProduct(${JSON.stringify(sp)})'>Sửa</button>`;
                    }
                    if (user.role === 'ADMIN') {
                        actions += ` <button class="btn" style="border: 1px solid var(--danger); color: var(--danger); padding: 0.25rem 0.5rem; font-size: 0.75rem;" onclick="deleteProduct(${sp.id})">Xóa</button>`;
                    }
                    
                    const branchTd = (user && user.role === 'ADMIN') 
                        ? `<td><span class="badge" style="background:var(--card-hover); border:1px solid var(--border); padding:0.25rem 0.55rem; font-size:0.75rem; border-radius:var(--radius-full);">${branchName}</span></td>` 
                        : '';

                    tbody.innerHTML += `
                        <tr>
                            <td style="font-weight:600; color:var(--primary);">${sp.maSanPham}</td>
                            <td>${sp.tenSanPham}</td>
                            ${branchTd}
                            <td><small>${ncc}</small></td>
                            <td style="font-weight:500;">${price}</td>
                            <td><strong>${sp.soLuongTon}</strong> ${sp.donVi || ''}</td>
                            <td>${status}</td>
                            <td>${actions || '-'}</td>
                        </tr>
                    `;
                });
            } catch (err) {
                const alert = document.getElementById('errorAlert');
                alert.textContent = err.message;
                alert.style.display = 'block';
            }
        }

        async function showModal() {
            document.getElementById('productForm').reset();
            document.getElementById('sp_id').value = '';
            document.getElementById('modalTitle').textContent = 'Thêm sản phẩm';
            document.getElementById('modalError').style.display = 'none';
            try { 
                const [nccRes, cnRes] = await Promise.all([
                    goiApi("/nha-cung-cap"),
                    (user && user.role === 'ADMIN') ? goiApi("/chi-nhanh") : Promise.resolve({ data: [] })
                ]);
                document.getElementById("sp_ncc").innerHTML = nccRes.data.map(n => `<option value="${n.id}">${n.tenNhaCungCap}</option>`).join("");
                if (user && user.role === 'ADMIN' && cnRes.data.length > 0) {
                    document.getElementById("sp_chinhanh").innerHTML = cnRes.data.map(c => `<option value="${c.id}">${c.tenChiNhanh}</option>`).join("");
                }
            } catch(e){}
            document.getElementById('productModal').style.display = 'flex';
        }

        function hideModal() {
            document.getElementById('productModal').style.display = 'none';
        }

        async function editProduct(sp) {
            document.getElementById('modalTitle').textContent = 'Sửa sản phẩm';
            document.getElementById('modalError').style.display = 'none';
            document.getElementById('sp_id').value = sp.id;
            document.getElementById('sp_ma').value = sp.maSanPham;
            document.getElementById('sp_ten').value = sp.tenSanPham;
            document.getElementById('sp_gia_ban').value = sp.giaBan;
            document.getElementById('sp_gia_von').value = sp.giaVon;
            document.getElementById('sp_don_vi').value = sp.donVi;
            try { 
                const [nccRes, cnRes] = await Promise.all([
                    goiApi("/nha-cung-cap"),
                    (user && user.role === 'ADMIN') ? goiApi("/chi-nhanh") : Promise.resolve({ data: [] })
                ]);
                document.getElementById("sp_ncc").innerHTML = nccRes.data.map(n => `<option value="${n.id}">${n.tenNhaCungCap}</option>`).join(""); 
                if (user && user.role === 'ADMIN' && cnRes.data.length > 0) {
                    document.getElementById("sp_chinhanh").innerHTML = cnRes.data.map(c => `<option value="${c.id}">${c.tenChiNhanh}</option>`).join("");
                    if (sp.chiNhanh) document.getElementById("sp_chinhanh").value = sp.chiNhanh.id;
                }
            } catch(e){}
            document.getElementById('sp_ncc').value = sp.nhaCungCap ? sp.nhaCungCap.id : '';
            document.getElementById('productModal').style.display = 'flex';
        }

        document.getElementById('productForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('sp_id').value;
            const data = {
                maSanPham: document.getElementById('sp_ma').value,
                tenSanPham: document.getElementById('sp_ten').value,
                nhaCungCapId: parseInt(document.getElementById('sp_ncc').value),
                giaBan: parseFloat(document.getElementById('sp_gia_ban').value),
                giaVon: parseFloat(document.getElementById('sp_gia_von').value),
                donVi: document.getElementById('sp_don_vi').value,
                hoatDong: true
            };
            if (user && user.role === 'ADMIN' && document.getElementById('sp_chinhanh').value) {
                data.chiNhanhId = parseInt(document.getElementById('sp_chinhanh').value);
            }

            try {
                if (id) {
                    await goiApi('/san-pham/' + id, { method: 'PUT', body: JSON.stringify(data) });
                } else {
                    await goiApi('/san-pham', { method: 'POST', body: JSON.stringify(data) });
                }
                hideModal();
                loadData();
            } catch (err) {
                const errDiv = document.getElementById('modalError');
                errDiv.textContent = err.message;
                errDiv.style.display = 'block';
            }
        });

        async function deleteProduct(id) {
            if (!confirm('Bạn có chắc chắn muốn xóa sản phẩm này?')) return;
            try {
                await goiApi('/san-pham/' + id, { method: 'DELETE' });
                alert('Xóa thành công!');
                loadData();
            } catch (err) {
                alert(err.message);
            }
        }
        
        document.addEventListener('DOMContentLoaded', loadData);
    </script>
    
    <script>
        function filterTable() {
            const input = document.getElementById("searchInput");
            const filter = input.value.toLowerCase();
            const tbody = document.getElementById("tableBody");
            const trs = tbody.getElementsByTagName("tr");
            
            for (let i = 0; i < trs.length; i++) {
                if (trs[i].getElementsByTagName("td").length === 1) continue;
                
                const tds = trs[i].getElementsByTagName("td");
                let match = false;
                for (let j = 0; j < tds.length; j++) {
                    if (tds[j]) {
                        const txtValue = tds[j].textContent || tds[j].innerText;
                        if (txtValue.toLowerCase().indexOf(filter) > -1) {
                            match = true;
                            break;
                        }
                    }
                }
                trs[i].style.display = match ? "" : "none";
            }
        }
    </script>
    <!-- Modal Đổi Mật Khẩu -->
    <div class="modal" id="changePasswordModal" style="display:none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;">
        <div class="modal-content" style="background: var(--card); padding: 2rem; border-radius: var(--radius-lg); width: 100%; max-width: 400px;">
            <h3 style="margin-bottom: 1rem; color: var(--primary);">Đổi Mật Khẩu</h3>
            <div id="pwdError" class="alert alert-danger" style="display:none;"></div>
            <form id="changePasswordForm">
                <div class="form-group">
                    <label class="form-label">Mật khẩu hiện tại</label>
                    <input type="password" id="pwd_current" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Mật khẩu mới</label>
                    <input type="password" id="pwd_new" class="form-control" required pattern="^[A-Z](?=.*[0-9])(?=.*[@$!%*?&.])[A-Za-z0-9@$!%*?&.]{7,}$" title="Mật khẩu phải dài ít nhất 8 ký tự, bắt đầu bằng chữ hoa, có số và ký tự đặc biệt">
                <div class="form-group">
                    <label class="form-label">Xác nhận mật khẩu</label>
                    <input type="password" id="pwd_confirm" class="form-control" required>
                </div>
                <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                    <button type="button" class="btn" style="flex: 1; border: 1px solid var(--border);" onclick="hideChangePasswordModal()">Hủy</button>
                    <button type="submit" class="btn btn-primary" style="flex: 1;">Xác nhận</button>
                </div>
            </form>
        </div>
    </div>
    <script>
        function showChangePasswordModal() {
            document.getElementById("changePasswordModal").style.display = "flex";
        }
        function hideChangePasswordModal() {
            document.getElementById("changePasswordModal").style.display = "none";
        }
        if (document.getElementById("changePasswordForm")) {
            document.getElementById("changePasswordForm").addEventListener("submit", async (e) => {
                e.preventDefault();
                const current = document.getElementById("pwd_current").value;
                const newPwd = document.getElementById("pwd_new").value;
                const confirm = document.getElementById("pwd_confirm").value;
                if (newPwd !== confirm) {
                    const err = document.getElementById("pwdError");
                    err.textContent = "Mật khẩu xác nhận không khớp";
                    err.style.display = "block";
                    return;
                }
                try {
                    await goiApi("/auth/change-password", {
                        method: "POST",
                        body: JSON.stringify({
                            currentPassword: current,
                            newPassword: newPwd,
                            confirmPassword: confirm
                        })
                    });
                    alert("Đổi mật khẩu thành công! Vui lòng đăng nhập lại.");
                    logout();
                } catch (err) {
                    const errDiv = document.getElementById("pwdError");
                    errDiv.textContent = err.message;
                    errDiv.style.display = "block";
                }
            });
        }
    </script>
</body>
</html>
