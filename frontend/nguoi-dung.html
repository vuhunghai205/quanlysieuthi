<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Người dùng - Hùng Hải Mart</title>
    <link rel="stylesheet" href="css/bien.css">
    <link rel="stylesheet" href="css/bo-cuc.css">
    <link rel="stylesheet" href="css/thanh-phan.css">
    <style>
        .table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        .table th, .table td { padding: 0.75rem; border-bottom: 1px solid var(--border); text-align: left; }
        .table th { background-color: var(--mint); color: var(--primary); }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-logo">Hùng Hải Mart</div>
            <nav class="sidebar-nav">
                <a href="tong-quan.html" class="nav-item">Tổng quan</a>
                <a href="san-pham.html" class="nav-item">Sản phẩm</a>
                <a href="chi-nhanh.html" class="nav-item" id="menu-chi-nhanh" style="display:none">Chi nhánh</a>
                <a href="nguoi-dung.html" class="nav-item active" id="menu-nguoi-dung" style="display:none">Người dùng</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div style="font-weight: 500;">Quản lý Người dùng</div>
                <div><button onclick="logout()" class="btn">Đăng xuất</button></div>
            </header>
            
            <div class="content-body">
                <div class="card">
                    <h3 class="card-title">Danh sách tài khoản</h3>
                    <div id="errorAlert" class="alert alert-danger"></div>
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Họ tên</th>
                                <th>Email</th>
                                <th>Vai trò</th>
                                <th>Chi nhánh</th>
                                <th>Trạng thái</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <tr><td colspan="5">Đang tải...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script>
        checkAuth();
        const user = getUser();
        if (user && user.role === 'ADMIN') {
            document.getElementById('menu-chi-nhanh').style.display = 'block';
            document.getElementById('menu-nguoi-dung').style.display = 'block';
        } else {
            document.querySelector('.content-body').innerHTML = '<div class="alert alert-danger" style="display:block">Bạn không có quyền truy cập trang này.</div>';
        }

        async function loadData() {
            if (user.role !== 'ADMIN') return;
            try {
                const res = await goiApi('/nguoi-dung');
                const tbody = document.getElementById('tableBody');
                tbody.innerHTML = '';
                res.data.forEach(nd => {
                    const status = nd.kichHoat ? '<span style="color:var(--primary)">Kích hoạt</span>' : '<span style="color:var(--danger)">Khóa</span>';
                    const branch = nd.chiNhanh ? nd.chiNhanh.tenChiNhanh : 'Toàn hệ thống';
                    tbody.innerHTML += `
                        <tr>
                            <td>${nd.hoTen}</td>
                            <td>${nd.email}</td>
                            <td>${nd.vaiTro}</td>
                            <td>${branch}</td>
                            <td>${status}</td>
                        </tr>
                    `;
                });
            } catch (err) {
                const alert = document.getElementById('errorAlert');
                alert.textContent = err.message;
                alert.style.display = 'block';
            }
        }
        
        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
