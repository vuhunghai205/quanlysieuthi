<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Hùng Hải Mart</title>
    <link rel="stylesheet" href="css/bien.css">
    <link rel="stylesheet" href="css/bo-cuc.css">
    <link rel="stylesheet" href="css/thanh-phan.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div style="text-align: center; margin-bottom: 2rem;">
                <h1 style="color: var(--primary); font-size: 1.5rem;">Hùng Hải Mart</h1>
                <p style="color: var(--text-muted); font-size: 0.875rem; margin-top: 0.5rem;">Hệ thống quản lý siêu thị</p>
            </div>
            
            <div id="loginError" class="alert alert-danger"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="email">Email</label>
                    <input type="email" id="email" class="form-control" required placeholder="Nhập email...">
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Mật khẩu</label>
                    <input type="password" id="password" class="form-control" required placeholder="Nhập mật khẩu...">
                </div>
                <button type="submit" id="submitBtn" class="btn btn-primary btn-block" style="padding: 0.75rem; font-size: 1rem;">Đăng nhập</button>
            </form>

            <div style="margin-top: 2rem; font-size: 0.75rem; color: var(--text-muted); border-top: 1px solid var(--border); padding-top: 1rem;">
                <p><strong>Demo Account:</strong></p>
                <p>Admin: admin@hunghaimart.vn / 123456</p>
            </div>
        </div>
    </div>
    
    <script src="js/api.js"></script>
    <script src="js/xac-thuc.js"></script>
</body>
</html>
