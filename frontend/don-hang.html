<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đơn hàng - Hùng Hải Mart</title>
    <link rel="stylesheet" href="css/bien.css">
    <link rel="stylesheet" href="css/bo-cuc.css">
    <link rel="stylesheet" href="css/thanh-phan.css">
    <style>
        .table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        .table th, .table td { padding: 0.75rem; border-bottom: 1px solid var(--border); text-align: left; }
        .table th { background-color: var(--mint); color: var(--primary); }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 100; align-items: center; justify-content: center; }
        .modal-content { background: var(--card); padding: 2rem; border-radius: var(--radius-lg); width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto;}
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-logo">Hùng Hải Mart</div>
            <nav class="sidebar-nav">
                <a href="tong-quan.html" class="nav-item">Tổng quan</a>
                <a href="san-pham.html" class="nav-item">Sản phẩm</a>
                <a href="don-hang.html" class="nav-item active">Đơn hàng</a>
                <a href="ton-kho.html" class="nav-item">Tồn kho</a>
                <a href="khach-hang.html" class="nav-item">Khách hàng</a>
                <a href="bao-cao.html" class="nav-item">Báo cáo</a>
                <a href="chi-nhanh.html" class="nav-item" id="menu-chi-nhanh" style="display:none">Chi nhánh</a>
                <a href="nguoi-dung.html" class="nav-item" id="menu-nguoi-dung" style="display:none">Người dùng</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div style="font-weight: 500;">Quản lý Đơn hàng</div>
                <div><button onclick="logout()" class="btn">Đăng xuất</button></div>
            </header>
            
            <div class="content-body">
                <div class="card">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                        <h3 class="card-title" style="margin: 0;">Lịch sử đơn hàng</h3>
                        <button class="btn btn-primary" onclick="showModal()">+ Tạo đơn hàng</button>
                    </div>
                    
                    <div id="errorAlert" class="alert alert-danger"></div>
                    
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Mã đơn</th>
                                <th>Tổng tiền</th>
                                <th>Trạng thái</th>
                                <th>Thanh toán</th>
                                <th>Thời gian</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <tr><td colspan="5">Đang tải...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal Form -->
    <div class="modal" id="orderModal">
        <div class="modal-content">
            <h3 style="margin-bottom: 1rem; color: var(--primary);">Tạo Đơn Hàng Mới</h3>
            <div id="modalError" class="alert alert-danger"></div>
            <form id="orderForm">
                <div class="form-group">
                    <label class="form-label">Chi nhánh</label>
                    <select id="dh_chi_nhanh" class="form-control" required></select>
                </div>
                <div class="form-group">
                    <label class="form-label">Chọn Sản phẩm (Bán 1 loại SP cho nhanh Demo)</label>
                    <select id="dh_san_pham" class="form-control" required></select>
                </div>
                <div class="form-group">
                    <label class="form-label">Số lượng</label>
                    <input type="number" id="dh_so_luong" class="form-control" value="1" min="1" required>
                </div>
                
                <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                    <button type="button" class="btn" style="flex: 1; border: 1px solid var(--border);" onclick="hideModal()">Hủy</button>
                    <button type="submit" class="btn btn-primary" style="flex: 1;" id="btnLuuDonHang">Hoàn tất thanh toán</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        checkAuth();
        const user = getUser();
        if (user && user.role === 'ADMIN') {
            document.getElementById('menu-chi-nhanh').style.display = 'block';
            document.getElementById('menu-nguoi-dung').style.display = 'block';
        }

        async function loadData() {
            try {
                const res = await goiApi('/don-hang');
                const tbody = document.getElementById('tableBody');
                tbody.innerHTML = '';
                
                if (!res.data || res.data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center">Chưa có đơn hàng nào.</td></tr>';
                    return;
                }

                res.data.sort((a,b) => b.id - a.id).forEach(dh => {
                    const price = new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(dh.tongTien);
                    const date = new Date(dh.ngayTao).toLocaleString('vi-VN');
                    tbody.innerHTML += `
                        <tr>
                            <td style="font-weight:600; color:var(--primary)">${dh.maDonHang}</td>
                            <td style="color:var(--danger)">${price}</td>
                            <td>${dh.trangThai}</td>
                            <td>${dh.trangThaiThanhToan}</td>
                            <td>${date}</td>
                        </tr>
                    `;
                });
            } catch (err) {
                const alert = document.getElementById('errorAlert');
                alert.textContent = err.message;
                alert.style.display = 'block';
            }
        }
        
        async function showModal() {
            document.getElementById('modalError').style.display = 'none';
            document.getElementById('orderModal').style.display = 'flex';
            
            // Load branches and products
            try {
                const cnRes = await goiApi('/chi-nhanh');
                const spRes = await goiApi('/san-pham');
                
                const cnSelect = document.getElementById('dh_chi_nhanh');
                cnSelect.innerHTML = cnRes.data.map(c => `<option value="${c.id}">${c.tenChiNhanh}</option>`).join('');
                
                const spSelect = document.getElementById('dh_san_pham');
                spSelect.innerHTML = spRes.data
                    .filter(s => s.hoatDong && s.soLuongTon > 0)
                    .map(s => `<option value="${s.id}">${s.tenSanPham} (Tồn: ${s.soLuongTon} - Giá: ${s.giaBan})</option>`).join('');
            } catch (err) {
                document.getElementById('modalError').textContent = "Không tải được dữ liệu: " + err.message;
                document.getElementById('modalError').style.display = 'block';
            }
        }

        function hideModal() {
            document.getElementById('orderModal').style.display = 'none';
        }

        document.getElementById('orderForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnLuuDonHang');
            btn.disabled = true;
            btn.textContent = "Đang xử lý...";
            
            const data = {
                chiNhanhId: parseInt(document.getElementById('dh_chi_nhanh').value),
                chiTiet: [
                    {
                        sanPhamId: parseInt(document.getElementById('dh_san_pham').value),
                        soLuong: parseInt(document.getElementById('dh_so_luong').value)
                    }
                ]
            };

            try {
                await goiApi('/don-hang', { method: 'POST', body: JSON.stringify(data) });
                hideModal();
                loadData();
                alert("Tạo đơn hàng thành công!");
            } catch (err) {
                const errDiv = document.getElementById('modalError');
                errDiv.textContent = err.message;
                errDiv.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = "Hoàn tất thanh toán";
            }
        });

        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
