<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Nhà Cung Cấp - Hùng Hải Mart</title>
    <link rel="stylesheet" href="css/bien.css">
    <link rel="stylesheet" href="css/bo-cuc.css">
    <link rel="stylesheet" href="css/thanh-phan.css">
    <style>
        .table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        .table th, .table td { padding: 0.75rem; border-bottom: 1px solid var(--border); text-align: left; }
        .table th { background-color: var(--mint); color: var(--primary); }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 100; align-items: center; justify-content: center; }
        .modal-content { background: var(--card); padding: 2rem; border-radius: var(--radius-lg); width: 100%; max-width: 500px;}
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-logo">Hùng Hải Mart</div>
            <nav class="sidebar-nav">
                <a href="tong-quan.html" class="nav-item">Tổng quan</a>
                <a href="san-pham.html" class="nav-item">Sản phẩm</a>
                <a href="don-hang.html" class="nav-item">Đơn hàng</a>
                <a href="ton-kho.html" class="nav-item">Tồn kho</a>
                <a href="nha-cung-cap.html" class="nav-item active" id="menu-ncc" style="display:none">Nhà cung cấp</a>
                <a href="nha-cung-cap.html" class="nav-item" id="menu-ncc" style="display:none">Nhà cung cấp</a>
                <a href="khach-hang.html" class="nav-item">Khách hàng</a>
                <a href="bao-cao.html" class="nav-item">Báo cáo</a>
                <a href="chi-nhanh.html" class="nav-item" id="menu-chi-nhanh" style="display:none">Chi nhánh</a>
                <a href="nguoi-dung.html" class="nav-item" id="menu-nguoi-dung" style="display:none">Người dùng</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div style="font-weight: 500;">Quản lý Nhà Cung Cấp</div>
                <div><button onclick="showChangePasswordModal()" class="btn" style="border: 1px solid var(--border); margin-right: 10px;">Đổi mật khẩu</button><button onclick="logout()" class="btn">Đăng xuất</button></div>
            </header>
            
            <div class="content-body">
                <div class="card">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                        <h3 class="card-title" style="margin: 0;">Danh sách Nhà Cung Cấp</h3>
                        <div style="display: flex; gap: 10px;">
                            <input type="text" id="searchInput" class="form-control" placeholder="Tìm kiếm nhà cung cấp..." style="width: 250px;" onkeyup="filterTable()">
                            <button class="btn btn-primary" onclick="showModal()">+ Thêm Nhà Cung Cấp</button>
                        </div>
                    </div>
                    
                    <div id="errorAlert" class="alert alert-danger"></div>
                    
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Tên Nhà Cung Cấp</th>
                                <th>Số điện thoại</th>
                                <th>Địa chỉ</th>
                                <th>Thao tác</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <tr><td colspan="4">Đang tải...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal Form -->
    <div class="modal" id="nccModal">
        <div class="modal-content">
            <h3 id="modalTitle" style="margin-bottom: 1rem; color: var(--primary);">Thêm Nhà Cung Cấp</h3>
            <div id="modalError" class="alert alert-danger"></div>
            <form id="nccForm">
                <input type="hidden" id="ncc_id">
                
                <div class="form-group">
                    <label class="form-label">Tên nhà cung cấp</label>
                    <input type="text" id="ncc_ten" class="form-control" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Số điện thoại</label>
                    <input type="text" id="ncc_sdt" class="form-control" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Địa chỉ</label>
                    <input type="text" id="ncc_dc" class="form-control" required>
                </div>
                
                <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                    <button type="button" class="btn" style="flex: 1; border: 1px solid var(--border);" onclick="hideModal()">Hủy</button>
                    <button type="submit" class="btn btn-primary" style="flex: 1;" id="btnSubmit">Lưu</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        checkAuth();
        const user = getUser();
        if (user && user.role === 'ADMIN') {
            document.getElementById('menu-chi-nhanh').style.display = 'block';
            document.getElementById('menu-nguoi-dung').style.display = 'block';
            if(document.getElementById('menu-ncc')) document.getElementById('menu-ncc').style.display = 'block';
            document.getElementById('menu-ncc').style.display = 'block';
        } else {
            alert('Bạn không có quyền truy cập trang này');
            window.location.href = 'tong-quan.html';
        }

        async function loadData() {
            try {
                const res = await goiApi('/nha-cung-cap');
                const tbody = document.getElementById('tableBody');
                tbody.innerHTML = '';
                
                if (!res.data || res.data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center">Chưa có dữ liệu.</td></tr>';
                    return;
                }

                res.data.forEach(ncc => {
                    tbody.innerHTML += `
                        <tr>
                            <td style="font-weight:bold; color:var(--primary)">${ncc.tenNhaCungCap}</td>
                            <td>${ncc.soDienThoai}</td>
                            <td>${ncc.diaChi}</td>
                            <td>
                                <button class="btn" style="padding: 2px 8px; font-size: 0.8rem; border: 1px solid var(--border)" onclick='editNcc(${JSON.stringify(ncc)})'>Sửa</button>
                                <button class="btn" style="padding: 2px 8px; font-size: 0.8rem; border: 1px solid var(--danger); color: var(--danger)" onclick="deleteNcc(${ncc.id})">Xóa</button>
                            </td>
                        </tr>
                    `;
                });
            } catch (err) {
                const alert = document.getElementById('errorAlert');
                alert.textContent = err.message;
                alert.style.display = 'block';
            }
        }

        function showModal() {
            document.getElementById('modalError').style.display = 'none';
            document.getElementById('nccModal').style.display = 'flex';
            document.getElementById('modalTitle').textContent = 'Thêm Nhà Cung Cấp';
            document.getElementById('nccForm').reset();
            document.getElementById('ncc_id').value = '';
        }

        function editNcc(ncc) {
            showModal();
            document.getElementById('modalTitle').textContent = 'Sửa Nhà Cung Cấp';
            document.getElementById('ncc_id').value = ncc.id;
            document.getElementById('ncc_ten').value = ncc.tenNhaCungCap;
            document.getElementById('ncc_sdt').value = ncc.soDienThoai;
            document.getElementById('ncc_dc').value = ncc.diaChi;
        }

        function hideModal() {
            document.getElementById('nccModal').style.display = 'none';
        }

        document.getElementById('nccForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            btn.disabled = true;
            btn.textContent = "Đang xử lý...";
            
            const id = document.getElementById('ncc_id').value;
            const data = {
                tenNhaCungCap: document.getElementById('ncc_ten').value,
                soDienThoai: document.getElementById('ncc_sdt').value,
                diaChi: document.getElementById('ncc_dc').value
            };

            try {
                if (id) {
                    await goiApi('/nha-cung-cap/' + id, { method: 'PUT', body: JSON.stringify(data) });
                } else {
                    await goiApi('/nha-cung-cap', { method: 'POST', body: JSON.stringify(data) });
                }
                hideModal();
                loadData();
                alert("Lưu thành công!");
            } catch (err) {
                const errDiv = document.getElementById('modalError');
                errDiv.textContent = err.message;
                errDiv.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = "Lưu";
            }
        });

        async function deleteNcc(id) {
            if (!confirm('Xóa nhà cung cấp này?')) return;
            try {
                await goiApi('/nha-cung-cap/' + id, { method: 'DELETE' });
                loadData();
            } catch (err) {
                alert(err.message);
            }
        }
        
        document.addEventListener('DOMContentLoaded', loadData);
    </script>
    
    <script>
        function filterTable() {
            const input = document.getElementById("searchInput");
            const filter = input.value.toLowerCase();
            const tbody = document.getElementById("tableBody");
            const trs = tbody.getElementsByTagName("tr");
            
            for (let i = 0; i < trs.length; i++) {
                if (trs[i].getElementsByTagName("td").length === 1) continue;
                
                const tds = trs[i].getElementsByTagName("td");
                let match = false;
                for (let j = 0; j < tds.length; j++) {
                    if (tds[j]) {
                        const txtValue = tds[j].textContent || tds[j].innerText;
                        if (txtValue.toLowerCase().indexOf(filter) > -1) {
                            match = true;
                            break;
                        }
                    }
                }
                trs[i].style.display = match ? "" : "none";
            }
        }
    </script>
    <!-- Modal Đổi Mật Khẩu -->
    <div class="modal" id="changePasswordModal" style="display:none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;">
        <div class="modal-content" style="background: var(--card); padding: 2rem; border-radius: var(--radius-lg); width: 100%; max-width: 400px;">
            <h3 style="margin-bottom: 1rem; color: var(--primary);">Đổi Mật Khẩu</h3>
            <div id="pwdError" class="alert alert-danger" style="display:none;"></div>
            <form id="changePasswordForm">
                <div class="form-group">
                    <label class="form-label">Mật khẩu hiện tại</label>
                    <input type="password" id="pwd_current" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Mật khẩu mới</label>
                    <input type="password" id="pwd_new" class="form-control" required pattern="^[A-Z](?=.*[0-9])(?=.*[@$!%*?&.])[A-Za-z0-9@$!%*?&.]{7,}$" title="Mật khẩu phải dài ít nhất 8 ký tự, bắt đầu bằng chữ hoa, có số và ký tự đặc biệt">
                <div class="form-group">
                    <label class="form-label">Xác nhận mật khẩu</label>
                    <input type="password" id="pwd_confirm" class="form-control" required>
                </div>
                <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                    <button type="button" class="btn" style="flex: 1; border: 1px solid var(--border);" onclick="hideChangePasswordModal()">Hủy</button>
                    <button type="submit" class="btn btn-primary" style="flex: 1;">Xác nhận</button>
                </div>
            </form>
        </div>
    </div>
    <script>
        function showChangePasswordModal() {
            document.getElementById("changePasswordModal").style.display = "flex";
        }
        function hideChangePasswordModal() {
            document.getElementById("changePasswordModal").style.display = "none";
        }
        if (document.getElementById("changePasswordForm")) {
            document.getElementById("changePasswordForm").addEventListener("submit", async (e) => {
                e.preventDefault();
                const current = document.getElementById("pwd_current").value;
                const newPwd = document.getElementById("pwd_new").value;
                const confirm = document.getElementById("pwd_confirm").value;
                if (newPwd !== confirm) {
                    const err = document.getElementById("pwdError");
                    err.textContent = "Mật khẩu xác nhận không khớp";
                    err.style.display = "block";
                    return;
                }
                try {
                    await goiApi("/auth/change-password", {
                        method: "POST",
                        body: JSON.stringify({
                            currentPassword: current,
                            newPassword: newPwd,
                            confirmPassword: confirm
                        })
                    });
                    alert("Đổi mật khẩu thành công! Vui lòng đăng nhập lại.");
                    logout();
                } catch (err) {
                    const errDiv = document.getElementById("pwdError");
                    errDiv.textContent = err.message;
                    errDiv.style.display = "block";
                }
            });
        }
    </script>
</body>
</html>
