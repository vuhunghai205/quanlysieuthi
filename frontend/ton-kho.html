<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Tồn kho - Hùng Hải Mart</title>
    <link rel="stylesheet" href="css/bien.css">
    <link rel="stylesheet" href="css/bo-cuc.css">
    <link rel="stylesheet" href="css/thanh-phan.css">
    <style>
        .table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        .table th, .table td { padding: 0.75rem; border-bottom: 1px solid var(--border); text-align: left; }
        .table th { background-color: var(--mint); color: var(--primary); }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-logo">Hùng Hải Mart</div>
            <nav class="sidebar-nav">
                <a href="tong-quan.html" class="nav-item">Tổng quan</a>
                <a href="san-pham.html" class="nav-item">Sản phẩm</a>
                <a href="don-hang.html" class="nav-item">Đơn hàng</a>
                <a href="ton-kho.html" class="nav-item active">Tồn kho</a>
                <a href="khach-hang.html" class="nav-item">Khách hàng</a>
                <a href="chi-nhanh.html" class="nav-item" id="menu-chi-nhanh" style="display:none">Chi nhánh</a>
                <a href="nguoi-dung.html" class="nav-item" id="menu-nguoi-dung" style="display:none">Người dùng</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div style="font-weight: 500;">Quản lý Tồn kho</div>
                <div><button onclick="logout()" class="btn">Đăng xuất</button></div>
            </header>
            
            <div class="content-body">
                <div class="card">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                        <h3 class="card-title" style="margin: 0;">Báo cáo tồn kho hiện tại</h3>
                        <div id="actionButtons" style="display:none;">
                            <button class="btn btn-primary" onclick="showNhapKho()">+ Nhập kho</button>
                            <button class="btn" style="border: 1px solid var(--warning); color: var(--warning);">Điều chỉnh</button>
                        </div>
                    </div>
                    
                    <div id="errorAlert" class="alert alert-danger"></div>
                    
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Mã SP</th>
                                <th>Tên sản phẩm</th>
                                <th>Tồn hiện tại</th>
                                <th>Đơn vị</th>
                                <th>Cảnh báo</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <tr><td colspan="5">Đang tải...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script>
        checkAuth();
        const user = getUser();
        if (user && user.role === 'ADMIN') {
            document.getElementById('menu-chi-nhanh').style.display = 'block';
            document.getElementById('menu-nguoi-dung').style.display = 'block';
        }
        if (user && (user.role === 'ADMIN' || user.role === 'MANAGER')) {
            document.getElementById('actionButtons').style.display = 'block';
        }

        async function loadData() {
            try {
                const res = await goiApi('/ton-kho');
                const tbody = document.getElementById('tableBody');
                tbody.innerHTML = '';
                
                if (!res.data || res.data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center">Chưa có dữ liệu.</td></tr>';
                    return;
                }

                res.data.forEach(sp => {
                    let alertHtml = '';
                    if (sp.soLuongTon <= 0) {
                        alertHtml = '<span style="color:var(--danger); font-weight:bold;">Hết hàng</span>';
                    } else if (sp.soLuongTon <= sp.mucTonToiThieu) {
                        alertHtml = '<span style="color:var(--warning); font-weight:bold;">Sắp hết</span>';
                    } else {
                        alertHtml = '<span style="color:var(--primary);">Bình thường</span>';
                    }
                    
                    tbody.innerHTML += `
                        <tr>
                            <td>${sp.maSanPham}</td>
                            <td>${sp.tenSanPham}</td>
                            <td style="font-weight:bold">${sp.soLuongTon}</td>
                            <td>${sp.donVi || ''}</td>
                            <td>${alertHtml}</td>
                        </tr>
                    `;
                });
            } catch (err) {
                const alert = document.getElementById('errorAlert');
                alert.textContent = err.message;
                alert.style.display = 'block';
            }
        }
        
        function showNhapKho() {
            alert('Chức năng nhập kho đang được triển khai popup!');
        }

        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
