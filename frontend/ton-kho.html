<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Tồn kho - Hùng Hải Mart</title>
    <link rel="stylesheet" href="css/bien.css">
    <link rel="stylesheet" href="css/bo-cuc.css">
    <link rel="stylesheet" href="css/thanh-phan.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-logo">Hùng Hải Mart</div>
            <nav class="sidebar-nav">
                <a href="tong-quan.html" class="nav-item">Tổng quan</a>
                <a href="san-pham.html" class="nav-item">Sản phẩm</a>
                <a href="don-hang.html" class="nav-item">Đơn hàng</a>
                <a href="ton-kho.html" class="nav-item active">Tồn kho</a>
                <a href="nha-cung-cap.html" class="nav-item" id="menu-ncc" style="display:none">Nhà cung cấp</a>
                <a href="khach-hang.html" class="nav-item">Khách hàng</a>
                <a href="bao-cao.html" class="nav-item">Báo cáo</a>
                <a href="chi-nhanh.html" class="nav-item" id="menu-chi-nhanh" style="display:none">Chi nhánh</a>
                <a href="nguoi-dung.html" class="nav-item" id="menu-nguoi-dung" style="display:none">Người dùng</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div style="font-weight: 500;">Quản lý Tồn kho</div>
                <div><button onclick="showChangePasswordModal()" class="btn" style="border: 1px solid var(--border); margin-right: 10px;">Đổi mật khẩu</button><button onclick="logout()" class="btn">Đăng xuất</button></div>
            </header>
            
            <div class="content-body">
                <div class="card">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 0.75rem;">
                        <div style="display: flex; align-items: center; gap: 0.75rem;">
                            <h3 class="card-title" style="margin: 0;">Báo cáo tồn kho hiện tại</h3>
                            <span id="branchBadge" style="font-size: 0.8rem; font-weight: 500; color: var(--primary); background: var(--primary-light); padding: 0.25rem 0.65rem; border-radius: var(--radius-full); border: 1px solid var(--mint);"></span>
                        </div>
                        <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                            <select id="branchFilter" class="form-control" style="width: 230px; display:none;" onchange="loadData()">
                                <option value="">Tất cả chi nhánh (Toàn hệ thống)</option>
                                <option value="1">Hùng Hải Mart Hà Nội</option>
                                <option value="2">Hùng Hải Mart Hồ Chí Minh</option>
                            </select>
                            <input type="text" id="searchInput" class="form-control" placeholder="Tìm kiếm tồn kho..." style="width: 200px;" onkeyup="filterTable()">
                            <div id="btnInventoryActions" style="display:none; display:flex; gap:8px;">
                                <button class="btn btn-primary" onclick="showModal('NHAP')">+ Nhập kho từ NCC</button>
                                <button class="btn" style="border: 1px solid var(--warning); color: var(--warning);" onclick="showModal('XUAT')">Xuất/Điều chỉnh</button>
                            </div>
                        </div>
                    </div>
                    
                    <div id="errorAlert" class="alert alert-danger" style="display:none;"></div>
                    
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Mã SP</th>
                                <th>Tên sản phẩm</th>
                                <th id="thBranch" style="display:none;">Chi nhánh</th>
                                <th>Nhà cung cấp</th>
                                <th>Tồn hiện tại</th>
                                <th>Đơn vị</th>
                                <th>Cảnh báo</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <tr><td colspan="6">Đang tải...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal Form -->
    <div class="modal" id="tonKhoModal">
        <div class="modal-content">
            <h3 id="modalTitle" style="margin-bottom: 1rem; color: var(--primary);">Nhập Kho</h3>
            <div id="modalError" class="alert alert-danger"></div>
            <form id="tonKhoForm">
                <input type="hidden" id="loai_gd">
                <div class="form-group" id="group_tk_chinhanh" style="display:none;">
                    <label class="form-label">Chi nhánh</label>
                    <select id="tk_chi_nhanh_select" class="form-control" onchange="filterProducts()"></select>
                </div>
                <input type="hidden" id="tk_chi_nhanh" value="1">
                
                <div class="form-group" id="group_ncc">
                    <label class="form-label">Nhà cung cấp</label>
                    <select id="tk_ncc" class="form-control" onchange="filterProducts()"></select>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Sản phẩm</label>
                    <select id="tk_san_pham" class="form-control" required></select>
                </div>

                <div class="form-group">
                    <label class="form-label">Số lượng</label>
                    <input type="number" id="tk_so_luong" class="form-control" value="10" min="1" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Ghi chú</label>
                    <input type="text" id="tk_ghi_chu" class="form-control" placeholder="Lý do nhập/xuất...">
                </div>
                
                <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                    <button type="button" class="btn" style="flex: 1; border: 1px solid var(--border);" onclick="hideModal()">Hủy</button>
                    <button type="submit" class="btn btn-primary" style="flex: 1;" id="btnSubmit">Lưu giao dịch</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        checkAuth();
        const user = getUser();
        if (user) {
            if (user.role === 'ADMIN') {
                if (document.getElementById('menu-chi-nhanh')) document.getElementById('menu-chi-nhanh').style.display = 'block';
                if (document.getElementById('menu-nguoi-dung')) document.getElementById('menu-nguoi-dung').style.display = 'block';
                if (document.getElementById('branchFilter')) document.getElementById('branchFilter').style.display = 'block';
                if (document.getElementById('thBranch')) document.getElementById('thBranch').style.display = 'table-cell';
                if (document.getElementById('group_tk_chinhanh')) document.getElementById('group_tk_chinhanh').style.display = 'block';
                document.getElementById('branchBadge').textContent = 'Toàn hệ thống (Tổng cả 2 chi nhánh)';
            } else {
                const branchName = user.branchName || (user.branch == 1 ? 'Chi nhánh Hà Nội' : (user.branch == 2 ? 'Chi nhánh Hồ Chí Minh' : 'Chi nhánh riêng'));
                document.getElementById('branchBadge').textContent = branchName;
                if (user.branch) document.getElementById('tk_chi_nhanh').value = user.branch;
            }
            if (user.role === 'ADMIN' || user.role === 'MANAGER') {
                if (document.getElementById('menu-ncc')) document.getElementById('menu-ncc').style.display = 'block';
                const btnActions = document.getElementById('btnInventoryActions');
                if (btnActions) btnActions.style.display = 'flex';
            }
        }

        let allProducts = [];

        async function loadData() {
            try {
                let url = '/san-pham';
                const branchFilter = document.getElementById('branchFilter');
                if (user && user.role === 'ADMIN' && branchFilter && branchFilter.value) {
                    url += `?chiNhanhId=${branchFilter.value}`;
                }
                const res = await goiApi(url);
                allProducts = res.data;
                const tbody = document.getElementById('tableBody');
                tbody.innerHTML = '';
                
                if (!allProducts || allProducts.length === 0) {
                    const colSpan = (user && user.role === 'ADMIN') ? 7 : 6;
                    tbody.innerHTML = `<tr><td colspan="${colSpan}" style="text-align:center">Chưa có dữ liệu tồn kho.</td></tr>`;
                    return;
                }

                allProducts.forEach(sp => {
                    const cb = sp.soLuongTon <= sp.mucTonToiThieu 
                        ? '<span style="color:var(--danger)">Sắp hết hàng</span>' 
                        : '<span style="color:var(--success)">Bình thường</span>';
                    const ncc = sp.nhaCungCap ? sp.nhaCungCap.tenNhaCungCap : '-';
                    const branchName = sp.chiNhanh ? sp.chiNhanh.tenChiNhanh : (sp.chiNhanhId == 1 ? 'Hà Nội' : (sp.chiNhanhId == 2 ? 'Hồ Chí Minh' : '-'));
                    const branchTd = (user && user.role === 'ADMIN') 
                        ? `<td><span class="badge" style="background:var(--card-hover); border:1px solid var(--border); padding:0.25rem 0.55rem; font-size:0.75rem; border-radius:var(--radius-full);">${branchName}</span></td>` 
                        : '';
                    
                    tbody.innerHTML += `
                        <tr>
                            <td style="font-weight:600; color:var(--primary);">${sp.maSanPham}</td>
                            <td>${sp.tenSanPham}</td>
                            ${branchTd}
                            <td><small>${ncc}</small></td>
                            <td style="font-weight:bold; color:var(--text-main); font-size:1.05rem;">${sp.soLuongTon}</td>
                            <td>${sp.donVi || ''}</td>
                            <td>${cb}</td>
                        </tr>
                    `;
                });
            } catch (err) {
                const alert = document.getElementById('errorAlert');
                alert.textContent = err.message;
                alert.style.display = 'block';
            }
        }

        async function showModal(loai) {
            document.getElementById('modalError').style.display = 'none';
            document.getElementById('tonKhoModal').style.display = 'flex';
            document.getElementById('loai_gd').value = loai;
            
            if (loai === 'NHAP') {
                document.getElementById('modalTitle').textContent = '📦 Nhập kho từ Nhà Cung Cấp';
                document.getElementById('group_ncc').style.display = 'block';
            } else {
                document.getElementById('modalTitle').textContent = '⚠️ Xuất / Điều chỉnh kho';
                document.getElementById('group_ncc').style.display = 'none';
            }

            try {
                const [nccRes, cnRes] = await Promise.all([
                    goiApi('/nha-cung-cap'),
                    (user && user.role === 'ADMIN') ? goiApi('/chi-nhanh') : Promise.resolve({ data: [] })
                ]);
                
                const nccSelect = document.getElementById('tk_ncc');
                nccSelect.innerHTML = '<option value="">-- Chọn Nhà cung cấp --</option>' + nccRes.data.map(c => `<option value="${c.id}">${c.tenNhaCungCap}</option>`).join('');
                
                if (user && user.role === 'ADMIN' && cnRes.data.length > 0) {
                    const cnSelect = document.getElementById('tk_chi_nhanh_select');
                    cnSelect.innerHTML = cnRes.data.map(c => `<option value="${c.id}">${c.tenChiNhanh}</option>`).join('');
                }

                filterProducts();
            } catch (err) {
                document.getElementById('modalError').textContent = "Không tải được dữ liệu: " + err.message;
                document.getElementById('modalError').style.display = 'block';
            }
        }

        function filterProducts() {
            const loai = document.getElementById('loai_gd').value;
            const nccId = document.getElementById('tk_ncc').value;
            const selectedBranch = (user && user.role === 'ADMIN') ? document.getElementById('tk_chi_nhanh_select').value : null;
            
            let filtered = allProducts;
            if (selectedBranch) {
                filtered = filtered.filter(p => p.chiNhanh && p.chiNhanh.id == selectedBranch);
            }
            if (loai === 'NHAP' && nccId) {
                filtered = filtered.filter(p => p.nhaCungCap && p.nhaCungCap.id == nccId);
            }

            const spSelect = document.getElementById('tk_san_pham');
            spSelect.innerHTML = filtered.map(s => {
                const ncc = s.nhaCungCap ? s.nhaCungCap.tenNhaCungCap : '';
                return `<option value="${s.id}">${s.tenSanPham} (Tồn: ${s.soLuongTon}) ${ncc ? ' - NCC: ' + ncc : ''}</option>`;
            }).join('');
        }

        function hideModal() {
            document.getElementById('tonKhoModal').style.display = 'none';
        }

        document.getElementById('tonKhoForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            btn.disabled = true;
            btn.textContent = "Đang xử lý...";
            
            let branchId = (user && user.role === 'ADMIN' && document.getElementById('tk_chi_nhanh_select').value)
                ? parseInt(document.getElementById('tk_chi_nhanh_select').value)
                : parseInt(document.getElementById('tk_chi_nhanh').value);

            const data = {
                sanPhamId: parseInt(document.getElementById('tk_san_pham').value),
                chiNhanhId: branchId,
                soLuong: parseInt(document.getElementById('tk_so_luong').value),
                loaiGiaoDich: document.getElementById('loai_gd').value,
                ghiChu: document.getElementById('tk_ghi_chu').value
            };

            let endpoint = data.loaiGiaoDich === 'NHAP' ? '/ton-kho/nhap' : '/ton-kho/dieu-chinh';
            try {
                await goiApi(endpoint, { method: 'POST', body: JSON.stringify(data) });
                hideModal();
                loadData();
                alert("Lưu giao dịch thành công!");
            } catch (err) {
                const errDiv = document.getElementById('modalError');
                errDiv.textContent = err.message;
                errDiv.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = "Lưu giao dịch";
            }
        });
        
        document.addEventListener('DOMContentLoaded', loadData);
    </script>
    
    <script>
        function filterTable() {
            const input = document.getElementById("searchInput");
            const filter = input.value.toLowerCase();
            const tbody = document.getElementById("tableBody");
            const trs = tbody.getElementsByTagName("tr");
            
            for (let i = 0; i < trs.length; i++) {
                if (trs[i].getElementsByTagName("td").length === 1) continue;
                
                const tds = trs[i].getElementsByTagName("td");
                let match = false;
                for (let j = 0; j < tds.length; j++) {
                    if (tds[j]) {
                        const txtValue = tds[j].textContent || tds[j].innerText;
                        if (txtValue.toLowerCase().indexOf(filter) > -1) {
                            match = true;
                            break;
                        }
                    }
                }
                trs[i].style.display = match ? "" : "none";
            }
        }
    </script>
    <!-- Modal Đổi Mật Khẩu -->
    <div class="modal" id="changePasswordModal" style="display:none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;">
        <div class="modal-content" style="background: var(--card); padding: 2rem; border-radius: var(--radius-lg); width: 100%; max-width: 400px;">
            <h3 style="margin-bottom: 1rem; color: var(--primary);">Đổi Mật Khẩu</h3>
            <div id="pwdError" class="alert alert-danger" style="display:none;"></div>
            <form id="changePasswordForm">
                <div class="form-group">
                    <label class="form-label">Mật khẩu hiện tại</label>
                    <input type="password" id="pwd_current" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Mật khẩu mới</label>
                    <input type="password" id="pwd_new" class="form-control" required pattern="^[A-Z](?=.*[0-9])(?=.*[@$!%*?&.])[A-Za-z0-9@$!%*?&.]{7,}$" title="Mật khẩu phải dài ít nhất 8 ký tự, bắt đầu bằng chữ hoa, có số và ký tự đặc biệt">
                <div class="form-group">
                    <label class="form-label">Xác nhận mật khẩu</label>
                    <input type="password" id="pwd_confirm" class="form-control" required>
                </div>
                <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                    <button type="button" class="btn" style="flex: 1; border: 1px solid var(--border);" onclick="hideChangePasswordModal()">Hủy</button>
                    <button type="submit" class="btn btn-primary" style="flex: 1;">Xác nhận</button>
                </div>
            </form>
        </div>
    </div>
    <script>
        function showChangePasswordModal() {
            document.getElementById("changePasswordModal").style.display = "flex";
        }
        function hideChangePasswordModal() {
            document.getElementById("changePasswordModal").style.display = "none";
        }
        if (document.getElementById("changePasswordForm")) {
            document.getElementById("changePasswordForm").addEventListener("submit", async (e) => {
                e.preventDefault();
                const current = document.getElementById("pwd_current").value;
                const newPwd = document.getElementById("pwd_new").value;
                const confirm = document.getElementById("pwd_confirm").value;
                if (newPwd !== confirm) {
                    const err = document.getElementById("pwdError");
                    err.textContent = "Mật khẩu xác nhận không khớp";
                    err.style.display = "block";
                    return;
                }
                try {
                    await goiApi("/auth/change-password", {
                        method: "POST",
                        body: JSON.stringify({
                            currentPassword: current,
                            newPassword: newPwd,
                            confirmPassword: confirm
                        })
                    });
                    alert("Đổi mật khẩu thành công! Vui lòng đăng nhập lại.");
                    logout();
                } catch (err) {
                    const errDiv = document.getElementById("pwdError");
                    errDiv.textContent = err.message;
                    errDiv.style.display = "block";
                }
            });
        }
    </script>
</body>
</html>
